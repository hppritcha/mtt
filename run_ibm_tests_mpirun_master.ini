# INI file for crusher

[MTTDefaults]
scratchdir = master_scratch
description = OpenMPI main
platform = OLCF-crusher
executor = sequential
restart_file = /ccs/home/howardp/mtt/master_scratch/ompi_logfile

[Profile:Installed]

#======================================================================
# Define some default launcher execution parameters
#======================================================================

[LauncherDefaults:OMPI]
plugin = OpenMPI
#plugin = ALPS
command = mpirun
np = 16
options = --display-allocation

skipped = 77
merge_stdout_stderr = 1
stdout_save_lines = 100
stderr_save_lines = 100

#======================================================================
# Test run phase - the executor will automatically change directory to
# the top directory where the tests were installed, so any search for
# executables will take place relative to that point
#======================================================================

[TestRun:IBMInstalledOMPI]
#plugin = ALPS
plugin = OpenMPI
parent = TestBuild:IBMInstalled
timeout = 180
test_dir = "collective, communicator, pt2pt, onesided, datatype, group, info, sessions"
#test_dir = "collective"
checkpoint_file = /ccs/home/howardp/mtt/master_scratch/ompi_logfile
#test_dir = "communicator, datatype, environment, group, info, io, pt2pt, random, topology"
#max_num_tests = 25
stdout_save_lines = 100
stderr_save_lines = 100

# Tests that are supposed to fail
fail_tests = abort:3 final:1

skip_tests = sendrecv_big sendrecv_rep_big mprobe improbe mprobe-mpich mprobe_usempi mprobe_mpifh improbe_usempi mprobe_usempif08 improbe_usempif08 isendrecv_big isendrecv_rep_big isendrecv_rep_big2 isendrecv_f sendrecv_rep_big2 improbe_mpifh int_overflow c_win_shared 1sided mt_1sided

[TestRun:OSUInstalledOMPI]
#plugin = ALPS
plugin = OpenMPI
parent = TestBuild:OSUInstalled
timeout = 600
test_dir = "mpi/pt2pt"
np = 2
stdout_save_lines = 1000
checkpoint_file = /ccs/home/howardp/mtt/master_scratch/ompi_logfile
