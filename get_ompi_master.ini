# INI file for perlmutter

[MTTDefaults]
scratchdir = master_scratch
description = OpenMPI main
platform = NERSC-perlmutter
executor = sequential
trial = False

[Profile:Installed]

#======================================================================
# Middleware construction phases - get the middleware, build, and
# install it. This isn't a required phase - if the purpose of this test
# is to simply stress the physical system, then one can skip this phase
#======================================================================

[MiddlewareGet:OMPIMaster]
plugin = OMPI_Snapshot
url =  https://download.open-mpi.org/nightly/open-mpi/main
#version_file = /global/homes/h/hpp/mtt_perlmutter/vf_master
mpi_name = ompi-nightly-main

#----------------------------------------------------------------------

[MiddlewareBuild:OMPIMaster]
parent = MiddlewareGet:OMPIMaster
plugin = Autotools
#configure_options = --with-cuda=/opt/nvidia/hpc_sdk/Linux_x86_64/21.11/cuda/11.5  --with-ofi=no --with-ucx=/global/common/software/m3169/perlmutter/ucx/1.11.1 --disable-oshmem
#configure_options = --with-cuda=${ENV:CUDA_HOME} --with-ofi=no --with-ucx=/global/common/software/m3169/perlmutter/ucx/1.11.1 --disable-oshmem
#configure_options =  --with-ofi=no --with-ucx=/global/common/software/m3169/perlmutter/ucx/1.11.1 --disable-oshmem
configure_options =  --with-ofi --with-cuda=${ENV:CUDA_HOME}  --disable-sphinx --with-pmix=internal
make_options = -j 12 install
stderr_save_lines = 100

#======================================================================
# Test construction phases - get and build the tests that the
# target software will run.
#======================================================================

[TestGet:IBM]
#plugin = Git
#url =  git@github.com:open-mpi/ompi-tests
#subdir = ibm
plugin = Copytree
src = /global/homes/h/hpp/ompi-tests/ibm
#parent required or test will run even if build failed
parent = MiddlewareBuild:OMPIMaster

[ASIS TestGet:OSU]
plugin = Copytree
src =  /global/homes/h/hpp/osu-micro-benchmarks-5.8-mtt
#parent required or test will run even if build failed
parent = MiddlewareBuild:OMPIMaster


#======================================================================
# Test build phase
#======================================================================

[TestBuild:IBMInstalled]
parent = TestGet:IBM
merge_stdout_stderr = 1
stderr_save_lines = 100
middleware = MiddlewareBuild:OMPIMaster
autogen_cmd = ./autogen.sh
configure_options = CC=mpicc CXX=mpic++ F77=mpif77 FC=mpifort
make_options = -j 4 -k

[TestBuild:OSUInstalled]
parent = TestGet:OSU
merge_stdout_stderr = 1
stderr_save_lines = 100
middleware = MiddlewareBuild:OMPIMaster
configure_options = CC=mpicc CXX=mpiCC FC=mpifort --enable-cuda --with-cuda=${ENV:CUDA_HOME}
make_options = -j 4

#======================================================================
# Define some default launcher execution parameters
#======================================================================

[LauncherDefaults:OMPI]
plugin = OpenMPI
#plugin = ALPS
command = mpirun --display-allocation
np = 16

skipped = 77
merge_stdout_stderr = 1
stdout_save_lines = 100
stderr_save_lines = 100

#======================================================================
# Test run phase - the executor will automatically change directory to
# the top directory where the tests were installed, so any search for
# executables will take place relative to that point
#======================================================================

[TestRun:IBMInstalledOMPI]
#plugin = ALPS
plugin = OpenMPI
parent = TestBuild:IBMInstalled
timeout = 120
test_dir = "collective, communicator, pt2pt, sessions, onesided"
#test_dir = "collective"
#test_dir = "communicator, datatype, environment, group, info, io, pt2pt, random, topology"
#max_num_tests = 10
stdout_save_lines = 100
stderr_save_lines = 100

# Tests that are supposed to fail
fail_tests = abort:3 final:1

skip_tests =  sendrecv_big sendrecv_rep_big  mprobe improbe mprobe-mpich mprobe_usempi mprobe_mpifh improbe_usempi mprobe_usempif08 improbe_usempif08 isendrecv_big isendrecv_rep_big isendrecv_rep_big2 sendrecv_rep_big2 int_overflow improbe_mpifh

[TestRun:OSUInstalledOMPI]
#plugin = ALPS
plugin = OpenMPI
parent = TestBuild:OSUInstalled
timeout = 600
test_dir = "mpi/pt2pt"
np = 2
stdout_save_lines = 1000

#======================================================================
# Reporter phase
#======================================================================

[Reporter: text file backup]
plugin = TextFile
filename = mttresults.txt
summary_footer =
detail_header  =
detail_footer  =
textwrap = 78

#----------------------------------------------------------------------

[Reporter: IU database]
plugin = IUDatabase
realm = OMPI
username = lanl
debug_screen = true
pwfile = /global/homes/h/hpp/mtt_perlmutter/pw_file
platform = NERSC-perlmutter
url = https://mtt.open-mpi.org/submit/cpy/api/

[Reporter: JunitXML]
plugin = JunitXML
filename = mttresults.xml
textwrap = 78
