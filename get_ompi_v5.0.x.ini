# INI file for perlmutter

[MTTDefaults]
scratchdir = v5.0.x_scratch
description = OpenMPI v5.0.x
platform = NERSC-perlmutter
executor = sequential

[Profile:Installed]

#======================================================================
# Middleware construction phases - get the middleware, build, and
# install it. This isn't a required phase - if the purpose of this test
# is to simply stress the physical system, then one can skip this phase
#======================================================================

[MiddlewareGet:OMPIMaster]
plugin = OMPI_Snapshot
url =  https://download.open-mpi.org/nightly/open-mpi/v5.0.x
#version_file = /global/homes/h/hpp/mtt_perlmutter/vf_v5.0.x
mpi_name = ompi-nightly-v5.0.x

#----------------------------------------------------------------------

[MiddlewareBuild:OMPIMaster]
parent = MiddlewareGet:OMPIMaster
plugin = Autotools
#configure_options = --with-cuda=/opt/nvidia/hpc_sdk/Linux_x86_64/21.11/cuda/11.5 --with-ofi=no --with-ucx=/global/common/software/m3169/perlmutter/ucx/1.11.1
configure_options = --with-ofi --with-ucx=no --with-pmix=internal --disable-sphinx
make_options = -j 12
checkpoint_file = /global/homes/h/hpp/mtt_perlmutter/v5.0.x_scratch/ompi_logfile

#======================================================================
# Test construction phases - get and build the tests that the
# target software will run.
#======================================================================

[TestGet:IBM]
plugin = Git
url =  git@github.com:open-mpi/ompi-tests
subdir = ibm
#plugin = Copytree
#src = /global/homes/h/hpp/ompi-tests/ibm
#parent required or test will run even if build failed
parent = MiddlewareBuild:OMPIMaster


#======================================================================
# Test build phase
#======================================================================

[TestBuild:IBMInstalled]
parent = TestGet:IBM
#merge_stdout_stderr = 1
#stderr_save_lines = 100
middleware = MiddlewareBuild:OMPIMaster
autogen_cmd = ./autogen.sh
configure_options = CC=mpicc CXX=mpic++ F77=mpif77 FC=mpifort
make_options = -j 4

#======================================================================
# Define some default launcher execution parameters
#======================================================================

[LauncherDefaults:OMPI]
plugin = OpenMPI
#plugin = ALPS
command = mpirun
np = 16

skipped = 77
merge_stdout_stderr = 1
stdout_save_lines = 100
stderr_save_lines = 100

#======================================================================
# Test run phase - the executor will automatically change directory to
# the top directory where the tests were installed, so any search for
# executables will take place relative to that point
#======================================================================

[TestRun:IBMInstalledOMPI]
#plugin = ALPS
plugin = OpenMPI
parent = TestBuild:IBMInstalled
timeout = 120
test_dir = "collective, communicator, pt2pt, sessions"
#test_dir = "collective"
#test_dir = "communicator, datatype, environment, group, info, io, pt2pt, random, topology"
max_num_tests = 10
stdout_save_lines = 100
stderr_save_lines = 100

# Tests that are supposed to fail
fail_tests = abort:3 final:1

skip_tests = comm_idup comm_idup_usempif08 comm_idup_usempi comm_idup_mpifh sendrecv_big sendrecv_rep_big ssend start startall testany mprobe improbe mprobe-mpich mprobe_usempi mprobe_mpifh improbe_usempi mprobe_usempif08 improbe_usempif08 isendrecv_big isendrecv_rep_big isendrecv_rep_big2 isendrecv_f sendrecv_rep_big2 int_overflow iallreduce_nocommute_gap ireduce_nocommute_gap improbe_mpifh bcast_struct scatter_gap iallgather_gap iallreduce_nocommute_gap_in_place ibcast_struct iexscan_nocommute_gap iexscan_nocommute_gap_in_place igather_gap ireduce_nocommute_gap ireduce_nocommute_gap_in_place ireduce_scatter_block_nocommute_gap ireduce_scatter_block_nocommute_gap_in_place iscan_nocommute_gap iscan_nocommute_gap_in_place iscatter_gap ireduce_nocommute_gap_inter ireduce_scatter_nocommute_gap_in_place allgather_gap_inter allreduce_nocommute_gap_inter reduce_scatter_nocommute_gap_inter reduce_scatter_nocommute_gap_inter reduce_scatter_block_nocommute_gap_inter reduce_scatter_block_nocommute_stride_inter iallgather_gap_inter allgather_gap_inter iallgatherv_gap_inter iallreduce_nocommute_gap_inter iallreduce_nocommute_gap_inter igather_gap_inter igatherv_gap_inter igatherv_gap_inter ireduce_nocommute_gap_inter ireduce_scatter_block_nocommute_gap_inter scatter_gap_inter isend iscatterv_gap_inter ireduce_scatter_nocommute_gap ireduce_scatter_nocommute_gap_inter iscatter_gap_inter comm_idup_with_info

# Upped the time allocated to almost 4 hours because of the hanging test runs.»
# Normally 3 hours should be enough. 4 hours is the max allowed for a»
# --qos=interactive job on Cori.

#allocate_cmd = salloc -N 4 -C knl --qos=interactive --ntasks-per-node=4 --exclusive --time=03:59:00 --no-shell --job-name=testRunMaster
#deallocate_cmd = scancel --name testRunMaster

# INI file for perlmutter

#======================================================================
# Reporter phase
#======================================================================

[Reporter: text file backup]
plugin = TextFile
filename = mttresults.txt
summary_footer =
detail_header  =
detail_footer  =
textwrap = 78

#----------------------------------------------------------------------

[Reporter: IU database]
plugin = IUDatabase
realm = OMPI
username = lanl
debug_screen = true
pwfile = /global/homes/h/hpp/mtt_perlmutter/pw_file
platform = NERSC-perlmutter-ucx
url = https://mtt.open-mpi.org/submit/cpy/api/

[Reporter: JunitXML]
plugin = JunitXML
filename = mttresults.xml
textwrap = 78

